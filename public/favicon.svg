<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Teal terminal tile -->
  <rect width="32" height="32" rx="6" fill="#0f766e"/>
  <!-- darker inset "screen" -->
  <rect x="4" y="5" width="24" height="22" rx="3" fill="#042f2e"/>
  <!-- traffic lights -->
  <circle cx="8" cy="9" r="1.1" fill="#5eead4" fill-opacity="0.55"/>
  <circle cx="11.5" cy="9" r="1.1" fill="#5eead4" fill-opacity="0.35"/>
  <circle cx="15" cy="9" r="1.1" fill="#5eead4" fill-opacity="0.2"/>
  <!-- </> code brackets -->
  <path
    d="M12.2 13.2 L8.6 16.5 L12.2 19.8"
    stroke="#5eead4"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M19.8 13.2 L23.4 16.5 L19.8 19.8"
    stroke="#99f6e4"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- slash -->
  <path
    d="M17.4 12.4 L14.6 20.6"
    stroke="#2dd4bf"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- cursor blink bar -->
  <rect x="21.5" y="22.2" width="4.5" height="1.6" rx="0.5" fill="#ccfbf1"/>
</svg>
